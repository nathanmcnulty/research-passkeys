name: Provider extension drift

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/provider-extension-drift.yml"
      - "browser-extensions/scripts/check-current-provider-tree.mjs"
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research tracker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check out current provider main
        run: git clone --depth 1 --filter=blob:none --no-checkout https://github.com/nathanmcnulty/keyvault-passkey-provider.git "$RUNNER_TEMP/provider"
      - name: Validate locked source bytes
        run: node browser-extensions/scripts/validate-upstream-provider-lock.mjs
      - name: Compare current provider extension tree
        run: node browser-extensions/scripts/check-current-provider-tree.mjs --provider-repo "$RUNNER_TEMP/provider"
