name: Browser extension baseline

on:
  pull_request:
    paths:
      - ".github/workflows/browser-extension-baseline.yml"
      - ".gitattributes"
      - "browser-extensions/upstream-provider.lock.json"
      - "browser-extensions/scripts/validate-upstream-provider-lock.mjs"
      - "browser-extensions/vendor/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-extension-baseline.yml"
      - ".gitattributes"
      - "browser-extensions/upstream-provider.lock.json"
      - "browser-extensions/scripts/validate-upstream-provider-lock.mjs"
      - "browser-extensions/vendor/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate immutable provider baseline
        run: node browser-extensions/scripts/validate-upstream-provider-lock.mjs --verify-upstream
