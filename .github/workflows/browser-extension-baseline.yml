name: Browser extension baseline

on:
  pull_request:
    paths:
      - ".github/workflows/browser-extension-baseline.yml"
      - ".gitattributes"
      - "browser-extensions/upstream-provider.lock.json"
      - "browser-extensions/scripts/validate-upstream-provider-lock.mjs"
      - "browser-extensions/scripts/refresh-upstream-provider-lock.mjs"
      - "browser-extensions/scripts/check-current-provider-tree.mjs"
      - "browser-extensions/vendor/**"
      - "browser-extensions/experiments/function-catalog/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-extension-baseline.yml"
      - ".gitattributes"
      - "browser-extensions/upstream-provider.lock.json"
      - "browser-extensions/scripts/validate-upstream-provider-lock.mjs"
      - "browser-extensions/scripts/refresh-upstream-provider-lock.mjs"
      - "browser-extensions/scripts/check-current-provider-tree.mjs"
      - "browser-extensions/vendor/**"
      - "browser-extensions/experiments/function-catalog/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate immutable provider baseline
        run: node browser-extensions/scripts/validate-upstream-provider-lock.mjs
      - name: Check baseline refresh command
        run: node --check browser-extensions/scripts/refresh-upstream-provider-lock.mjs
      - name: Check current-tree comparison command
        run: node --check browser-extensions/scripts/check-current-provider-tree.mjs
      - name: Validate read-only catalog experiment
        run: node --test browser-extensions/experiments/function-catalog/catalog.test.mjs
