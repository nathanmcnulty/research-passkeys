name: Broker Coordination

on:
  push:
    branches: [main]
    paths:
      - 'broker/**'
      - '.github/workflows/broker-coordination.yml'
      - 'function-app/**'
      - 'powershell/**'
      - 'python/libraries/passkey/**'
      - '.gitattributes'
  pull_request:
    paths:
      - 'broker/**'
      - '.github/workflows/broker-coordination.yml'
      - 'function-app/**'
      - 'powershell/**'
      - 'python/libraries/passkey/**'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broker-coordination-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coordination:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: broker/tools/package-lock.json
      - name: Install broker and pinned local emulator
        run: |
          python -m pip install -r broker/requirements.lock
          python -m pip install --no-deps -e ./broker
          npm ci --prefix broker/tools --ignore-scripts
      - name: Validate durable owner-partition transactions
        run: python broker/tools/validate.py
      - name: Preserve existing research boundary tests
        run: python -m unittest discover -s function-app/tests -p 'test_*.py' -v
