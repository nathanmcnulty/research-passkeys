name: Test Passkey Login (Private Key)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  POWERSHELL_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  test-private-key:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify installed PowerShell 7.6
        shell: pwsh
        run: |
          Write-Host "Installed PowerShell: $($PSVersionTable.PSVersion) ($([Environment]::ProcessPath))"
          if ($PSVersionTable.PSVersion.Major -ne 7 -or $PSVersionTable.PSVersion.Minor -ne 6) {
            throw "Expected installed PowerShell 7.6, got $($PSVersionTable.PSVersion)."
          }
          if ([Microsoft.PowerShell.Telemetry.ApplicationInsightsTelemetry]::CanSendTelemetry) {
            throw 'Telemetry must be disabled before PowerShell starts.'
          }

      - name: Run local action with private key fallback
        id: passkey
        uses: ./
        with:
          credential-id: ${{ secrets['PASSKEY_PRIVATE_CREDENTIAL_ID'] }}
          user-handle: ${{ secrets['PASSKEY_PRIVATE_USER_HANDLE'] }}
          user-principal-name: ${{ secrets['PASSKEY_PRIVATE_USER_PRINCIPAL_NAME'] }}
          private-key: ${{ secrets['PASSKEY_PRIVATE_KEY'] }}

      - name: Validate outputs without printing the cookie
        shell: pwsh
        env:
          ESTS_COOKIE: ${{ steps.passkey.outputs.auth-cookie }}
        run: |
          if ('${{ steps.passkey.outputs.authenticated }}' -ne 'true') {
            throw 'Passkey authentication did not complete successfully.'
          }

          if ([string]::IsNullOrWhiteSpace($env:ESTS_COOKIE)) {
            throw 'The action did not return an auth-cookie output.'
          }

          Write-Host "Authentication succeeded for ${{ steps.passkey.outputs.user-principal-name }} using ${{ steps.passkey.outputs.signature-method }}."
          Write-Host "Returned cookie type: ${{ steps.passkey.outputs.cookie-name }}"
